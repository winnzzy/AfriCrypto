    <title>AfriCrypto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    keyframes: {
                        'scan-line': {
                            '0%': { transform: 'translateY(0px)' },
                            '100%': { transform: 'translateY(calc(100% - 2px))' }, // Scan full height of its container
                        },
                        'fade-in-down': {
                            '0%': { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    },
                    animation: {
                        'scan-line': 'scan-line 1.5s linear infinite alternate', // Alternate direction
                        'fade-in-down': 'fade-in-down 0.5s ease-out forwards',
                    },
                }
            }
        }
    </script>
    <style>
      /* Basic scrollbar styling */
      /* For WebKit browsers (Chrome, Safari, Edge) */
      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .scrollbar-thumb-slate-700::-webkit-scrollbar-thumb {
        background-color: #334155; /* slate-700 */
        border-radius: 3px;
      }
       .scrollbar-thumb-slate-700::-webkit-scrollbar-thumb:hover {
        background-color: #475569; /* slate-600 */
      }
      .scrollbar-track-slate-800::-webkit-scrollbar-track {
        background-color: #1e293b; /* slate-800 */
      }
      
      /* For Firefox */
      .scrollbar-thin {
        scrollbar-width: thin;
        scrollbar-color: #334155 #1e293b; /* thumb track */
      }

      /* Ensure notifications are visible */
      .animate-fade-in-down {
        opacity: 0; /* Start hidden for animation */
      }
    </style>
